# Otter: Minimaler Runner-Crate für robuste Prozessausführung & Log-Filter.
# Schneefuchs: clap v4.5 (derive+env), Edition 2021; default-run fix; autobins aus; Zip via zip + walkdir.
# Maus: Windows-first; saubere Vorgabe für cargo run; keine toten Warnungen im Default-Build.
# Datei: rust/otter_proc/Cargo.toml

[package]
name = "otter_proc"
version = "0.1.0"
edition = "2021"
default-run = "otter_proc"
autobins = false

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
walkdir = "2.5"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[features]
win-probe = []
default = []

[[bin]]
name = "otter_proc"
path = "src/main.rs"
